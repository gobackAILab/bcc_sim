<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>bcc-sim · 바카라 마틴게일 시뮬레이터</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nes.css@2.3.0/css/nes.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">

  <aside id="settings-panel" aria-label="설정">
    <header class="panel-header">
      <h2 class="nes-text is-primary">⚙ 설정</h2>
      <button type="button" id="toggle-panel" class="nes-btn is-warning icon-btn" title="패널 접기" aria-controls="settings-panel" aria-expanded="true">«</button>
    </header>
    <form id="config-form">

      <div class="nes-container with-title is-rounded form-group">
        <p class="title">전략</p>
        <label class="radio"><input type="radio" class="nes-radio" name="strategy_name" value="flat"><span>flat</span></label>
        <label class="radio"><input type="radio" class="nes-radio" name="strategy_name" value="martingale" checked><span>martingale</span></label>
      </div>

      <div class="nes-container with-title is-rounded form-group">
        <p class="title">기준 베팅</p>
        <label class="radio"><input type="radio" class="nes-radio" name="side" value="BANKER" checked><span>banker</span></label>
        <label class="radio"><input type="radio" class="nes-radio" name="side" value="PLAYER"><span>player</span></label>
      </div>

      <div class="nes-container with-title is-rounded form-group">
        <p class="title">자본 (원)</p>
        <label>initial<input type="number" class="nes-input" name="initial_won" min="1"></label>
        <label>target<input type="number" class="nes-input" name="target_won" min="1"></label>
        <label>ruin<input type="number" class="nes-input" name="ruin_won" min="0"></label>
      </div>

      <div class="nes-container with-title is-rounded form-group">
        <p class="title">베팅 (원)</p>
        <label>base-bet<input type="number" class="nes-input" name="base_bet_won" min="1"></label>
        <label>table-max<input type="number" class="nes-input" name="table_max_won" min="1"></label>
      </div>

      <div class="nes-container with-title is-rounded form-group">
        <p class="title">마틴게일</p>
        <label>steps<input type="number" class="nes-input" name="martin_steps" min="1" max="20"></label>
        <label class="checkbox"><input type="checkbox" class="nes-checkbox" name="pivot"><span>pivot</span></label>
      </div>

      <div class="nes-container with-title is-rounded form-group">
        <p class="title">슈</p>
        <label>decks<input type="number" class="nes-input" name="n_decks" min="1" max="16"></label>
        <label>cut-offset<input type="number" class="nes-input" name="cut_offset" min="0" max="200"></label>
      </div>

      <div class="nes-container with-title is-rounded form-group">
        <p class="title">진행</p>
        <label>delay (ms)<input type="number" class="nes-input" name="hand_delay_ms" min="0" max="5000" step="50"></label>
        <label class="checkbox"><input type="checkbox" class="nes-checkbox" name="auto_next"><span>auto next</span></label>
        <label>seed<input type="number" class="nes-input" name="seed"></label>
      </div>

      <div class="settings-actions">
        <button type="submit" id="apply-btn" class="nes-btn is-primary">Apply</button>
      </div>
    </form>
  </aside>

  <main id="dashboard">

    <header class="dashboard-header">
      <button type="button" id="show-panel" class="nes-btn is-warning icon-btn" hidden title="패널 열기" aria-controls="settings-panel" aria-expanded="false">»</button>
      <h1 class="nes-text is-primary">바카라 마틴게일 시뮬레이터</h1>
      <span id="app-version" class="app-version" title="bcc-sim 버전">v—</span>
      <span id="connection" class="nes-badge offline"><span>offline</span></span>
    </header>

    <section class="nes-container with-title is-rounded card-panel" id="gauge-section">
      <p class="title">자본 게이지</p>
      <div id="gauge-bar">
        <div id="gauge-fill"></div>
        <div id="gauge-marker" title="시작 자본"></div>
      </div>
      <div id="gauge-labels">
        <span class="g-left">ruin <em id="g-ruin">-</em></span>
        <span class="g-center">initial <em id="g-initial">-</em></span>
        <span class="g-right">target <em id="g-target">-</em></span>
      </div>
    </section>

    <section class="nes-container with-title is-rounded card-panel" id="capital-section">
      <p class="title">자본</p>
      <div class="row big">
        <span class="label">현재 자본</span>
        <span class="value mono" id="capital">-</span>
        <span class="muted mono" id="session-pnl"></span>
      </div>
      <div class="row">
        <span class="label">누적 손익</span>
        <span class="value mono" id="cumulative-pnl">0원</span>
        <span class="muted mono" id="cumulative-detail"></span>
      </div>
    </section>

    <section class="nes-container with-title is-rounded card-panel" id="current-hand">
      <p class="title">현재 핸드</p>
      <div class="row title-row">
        <span>핸드 <strong id="hand-num">-</strong></span>
        <span id="martin-event" class="martin-tag"></span>
      </div>
      <div class="row">
        <span class="label">베팅</span>
        <span class="value" id="bet-side">-</span>
        <span class="value mono" id="bet-amount">-</span>
      </div>
      <div class="row cards-row">
        <span class="label side-label player-label">Player</span>
        <span class="cards mono" id="player-cards"></span>
        <span class="total mono">= <strong id="player-total">-</strong></span>
      </div>
      <div class="row cards-row">
        <span class="label side-label banker-label">Banker</span>
        <span class="cards mono" id="banker-cards"></span>
        <span class="total mono">= <strong id="banker-total">-</strong></span>
      </div>
      <div class="row">
        <span class="label">결과</span>
        <span class="value" id="hand-outcome">-</span>
        <span class="value mono" id="hand-delta"></span>
      </div>
    </section>

    <section class="nes-container with-title is-rounded card-panel" id="recent-section">
      <p class="title">최근 핸드</p>
      <ol id="recent-list" class="mono"></ol>
    </section>

    <section class="nes-container with-title is-rounded card-panel" id="session-stats">
      <p class="title">통계</p>
      <div class="row">
        <span class="label">세션</span>
        <span class="value">#<span id="session-num">-</span></span>
        <span class="muted">시드 <span id="session-seed" class="mono">-</span></span>
      </div>
      <div class="row">
        <span class="label">진행</span>
        <span class="value mono">핸드 <span id="stat-hands">0</span> · 베팅 <span id="stat-bets">0</span> · 최장연패 <span id="stat-streak">0</span></span>
      </div>
      <div class="row">
        <span class="label">체감</span>
        <span class="value mono" id="stat-realtime" title="한 핸드 = 40초로 환산">-</span>
      </div>
      <div class="row">
        <span class="label">누계</span>
        <span class="value mono">승 <span id="cum-wins">0</span> · 파산 <span id="cum-ruins">0</span> · 진행 <span id="cum-sessions">0</span></span>
      </div>
      <div class="row">
        <span class="label">누계체감</span>
        <span class="value mono" id="cum-realtime" title="누적 핸드 × 40초">-</span>
      </div>
    </section>

    <section class="nes-container with-title is-rounded card-panel" id="controls">
      <p class="title">컨트롤</p>
      <div class="control-buttons">
        <button type="button" id="start-btn" class="nes-btn is-success">▶ Start</button>
        <button type="button" id="pause-btn" class="nes-btn is-warning" disabled>⏸ Pause</button>
        <button type="button" id="next-btn" class="nes-btn is-success" disabled>⏭ Next</button>
      </div>
    </section>

    <div id="error-banner" class="nes-container is-error is-rounded" hidden></div>
  </main>

</div>
<script src="/static/app.js"></script>
</body>
</html>
